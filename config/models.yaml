# AlphaSeeker Model Configuration
#
# Retained vault/shared LLM calls use two compatibility model roles.
# Users can override any model by editing this file or setting environment variables.
#
# Format: harness.ROLE = "provider/model-name"
#
# Note: the key name "harness" is retained as a model-config compatibility
# label; the legacy subprocess harness itself has been removed.
#
# Supported provider prefixes:
#   - "sf/*"       → SiliconFlow (e.g. "sf/Qwen/Qwen3-14B")
#   - "kimi-*"     → Moonshot Kimi (e.g. "kimi-k2.5")
#   - "minimax/*"  → MiniMax via OpenAI-compatible API (e.g. "minimax/MiniMax-M2.5")
#   - "gemini-*"   → Google Gemini (e.g. "gemini-2.5-flash")
#   - "gpt-*"      → OpenAI API (e.g. "gpt-4o")
#   - "codex/*"    → ChatGPT Codex subscription via ~/.lingtai-tui/codex-auth.json (e.g. "codex/gpt-5.5")
#   - "claude-*"   → Anthropic (e.g. "claude-sonnet-4-20250514")
#
# Environment variable override: ALPHASEEKER_MODEL_HARNESS_<ROLE>
#   Example: ALPHASEEKER_MODEL_HARNESS_AGENT="gpt-4o"

# ---------------------------------------------------------------------------
# Vault / bridge model roles
# ---------------------------------------------------------------------------
harness:
  agent: "codex/gpt-5.5"
  condense: "codex/gpt-5.5"
